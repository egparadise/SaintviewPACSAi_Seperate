# Saintview Viewer Suite — nginx 서빙 설정 (운영 배포용)
#
# ⚠ 실서버 점검(2026-07-27, sv70.cloudcare.life)에서 발견된 문제를 고치는 설정이다:
#   ① gzip 이 꺼져 있어 index-*.js 823KB 를 **무압축 그대로** 전송 (gzip 시 220KB, brotli 171KB)
#   ② /assets/* 에 Cache-Control 이 없어 매 접속마다 전 파일 재검증(왕복 6회 낭비)
# 두 가지만 고쳐도 뷰어 창 열기가 눈에 띄게 빨라진다(특히 원격·저대역).
#
# 적용:
#   1) 이 파일을 nginx conf.d 에 넣거나 server 블록 내용을 기존 설정에 병합
#   2) nginx -t 로 문법 확인 후  nginx -s reload
#
# 전제: `npm run build` 산출물(dist)을 root 로 서빙. 빌드가 .gz/.br 를 함께 만들어 두므로
#       gzip_static 이 켜져 있으면 런타임 CPU 없이 압축본을 그대로 보낸다.

server {
    listen 443 ssl http2;
    server_name  _;                      # 실제 도메인으로 교체

    ssl_certificate     /etc/nginx/certs/dev.crt;   # 실제 인증서 경로로 교체
    ssl_certificate_key /etc/nginx/certs/dev.key;

    root /opt/saintview-viewer/frontend/dist;       # 실제 dist 경로로 교체
    index index.html;

    # ── ① 압축 ────────────────────────────────────────────────────────────
    # 빌드가 만들어 둔 .gz 를 그대로 서빙(런타임 압축 CPU 0). 없으면 즉석 gzip.
    gzip_static on;
    # brotli_static on;      # ngx_brotli 모듈이 있으면 주석 해제(.br 사용, gzip 대비 20% 더 작음)

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    # application/wasm 필수 — 뷰어 디코더 wasm 이 2.67MB 다. 빠뜨리면 gzip_static 이 쓸
    # .gz 가 없을 때(사전압축 안 된 배포·다른 앞단) 런타임 gzip 도 안 걸려 원본이 그대로 나간다.
    gzip_types
        application/javascript text/javascript application/json
        text/css text/plain image/svg+xml application/manifest+json
        application/wasm;

    # ── ② 캐시 ────────────────────────────────────────────────────────────
    # 자산 파일명에 콘텐츠 해시가 박혀 있으므로(index-B03RK0q_.js) 영구 캐시가 안전하다.
    # 새 배포는 파일명이 바뀌어 자동으로 새로 받는다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 은 절대 캐시하지 않는다(새 배포를 즉시 인식해야 함)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── ③ 백엔드·영상 프록시 ───────────────────────────────────────────────
    # ⚠ 반드시 127.0.0.1 — 'localhost' 는 IPv6(::1) 우선 조회 후 IPv4 폴백으로
    #    연결당 ~200ms 지연이 붙는다(실측: localhost 219ms vs 127.0.0.1 11ms).
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";            # keep-alive 유지(프레임마다 재연결 방지)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;                   # 대용량 검사 프리페치 대비
        proxy_buffering off;                       # SSE(/api/webpacs/live/sse-status) 대비
    }

    location /dicom-web/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 렌더 프레임은 이미 압축 포맷(PNG/JPEG) — gzip 재압축 금지(CPU만 소모)
        gzip off;
    }

    location /orthanc/ {
        proxy_pass http://127.0.0.1:8043/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        gzip off;
    }

    # SPA 폴백 — 뷰어/판독 창(?viewer=2d&study=..)도 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
