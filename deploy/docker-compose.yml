# Saintview Viewer Suite — 독립 인프라 (메인 Saintview PACS AI 와 나란히 실행 가능하도록
# 컨테이너명·포트·볼륨을 분리했다. 다른 서버에 단독 배포 시에도 이 파일 그대로 사용)
#   PostgreSQL : 5434  ·  Orthanc HTTP/DICOMweb : 8043  ·  Orthanc DICOM(C-STORE) : 4243  ·  OHIF : 3001
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: svviewer-db
    environment:
      POSTGRES_DB: saintview
      POSTGRES_USER: saintview
      POSTGRES_PASSWORD: ${SAINTVIEW_DB_PASSWORD:-saintview_dev}
    ports:
      - "5434:5432"
    volumes:
      - svviewer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saintview"]
      interval: 5s
      timeout: 3s
      retries: 10

  orthanc:
    image: orthancteam/orthanc:latest  # HTJ2K 트랜스코딩 지원
    container_name: svviewer-orthanc
    environment:
      ORTHANC__NAME: "SaintviewViewerOrthanc"
      ORTHANC__DICOM_AET: "${SVVIEWER_AET:-SVVIEWER}"
      ORTHANC__DICOM_PORT: "4242"
      ORTHANC__HTTP_PORT: "8042"
      ORTHANC__REGISTERED_USERS: '{"saintview": "${ORTHANC_PASSWORD:-saintview_dev}"}'
      # 개발: OHIF 프록시(인증 헤더 없음) 허용을 위해 비활성. 운영 배포 시 true + 프록시 인증 필수
      ORTHANC__AUTHENTICATION_ENABLED: "${ORTHANC_AUTH:-false}"
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      ORTHANC__OVERWRITE_INSTANCES: "true"
      # 문자셋 태그(0008,0005) 없는 한국 DICOM을 EUC-KR(ISO_IR 149)로 해석 — 미설정 시 Latin1 로 한글 깨짐
      ORTHANC__DEFAULT_ENCODING: "Korean"
      ORTHANC__DICOM_CHECK_MODALITY_HOST: "${ORTHANC_CHECK_MODALITY_HOST:-false}"
      ORTHANC__DICOM_CHECK_CALLED_AET: "${ORTHANC_CHECK_CALLED_AET:-false}"
      ORTHANC__DICOM_SERVER_ENABLED: "${ORTHANC_DICOM_SERVER_ENABLED:-true}"
      # MWL — 백엔드 /api/orders/export-mwl 이 .wl 파일을 쓰면 장비 C-FIND(MWL)에 응답
      ORTHANC__WORKLISTS__ENABLE: "true"
      ORTHANC__WORKLISTS__DATABASE: "/var/lib/orthanc/worklists"
    ports:
      - "8043:8042"   # HTTP / DICOMweb
      - "4243:4242"   # DICOM C-STORE
    volumes:
      - svviewer_orthanc:/var/lib/orthanc/db
      - ./worklists:/var/lib/orthanc/worklists

  ohif:
    image: ohif/app:v3.9.2
    container_name: svviewer-ohif
    depends_on:
      - orthanc
    ports:
      - "3001:80"
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
      - ./ohif/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  svviewer_pgdata:
  svviewer_orthanc:
